<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <header>
            <h1>Dictionary</h1>
            <p>Search any English word instantly.</p>
        </header>

        <section class="search-box">
            <input type="text" placeholder="Search for a word..." id="input-box">
            <button>Search</button>
        </section>

        <section class="result">

           <div class="word-info">

            <div class="word-details">


                <h2 class="word">Digital</h2>

                <p class="pronunciation">pronun...</p>

                <p class="part-of-speech">Adjective</p>


            </div>

            <button class="audio-btn"><i class="ri-volume-up-line"></i></button>


           </div>

           

           <div class="meaning-section">
            <h3>Meaning</h3>

            <p class="definition">
                Defination
            </p>

           </div>

           

           <!-- <div class="example-section">

            <h3>Example</h3>

            <p>
                Example sentence...
            </p>

           </div> -->

        


           <div class="synonyms-section">

            <h3>Synonyms</h3>

            <div class="tags">
                
            </div>

           </div>

         

           <!-- <div class="antonyms-section">

            <h3>Antonyms</h3>

            <div class="tags">
                <span>Analog</span>

                <span>Manual</span>

            </div> -->


           </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
